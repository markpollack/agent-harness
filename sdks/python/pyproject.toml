[project]
name = "agent-workflow"
version = "0.1.0a1"
description = "Python authoring SDK for the agent-workflow Workflow IR (workflow/v2alpha): author, validate, and emit WorkflowSpec JSON executed by the JVM engine"
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
authors = [{ name = "Mark Pollack" }]
keywords = ["workflow", "agents", "ir", "workflow-spec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Runtime deps are deliberately minimal: schema validation + RFC 8785 canonicalization
# (rfc8785 is a recorded P1.0 decision — hand-rolling JCS number formatting is the
# DD-15-rejected alternative). Nothing else.
dependencies = [
    "jsonschema>=4.21",
    "rfc8785>=0.1.4",
]

[project.urls]
Repository = "https://github.com/markpollack/agent-workflow"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workflow"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=agent_workflow --cov-report=term-missing"
